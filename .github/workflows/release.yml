name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable releases use the default branch; prereleases use Dev
        required: true
        type: choice
        options:
          - stable
          - alpha
          - beta

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Check release channel and branch
        env:
          CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$CHANNEL" == "stable" && "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Stable releases must be dispatched from $DEFAULT_BRANCH." >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "stable" && "$REF_NAME" != "Dev" ]]; then
            echo "Alpha and beta releases must be dispatched from Dev." >&2
            exit 1
          fi

  codeql:
    name: CodeQL
    needs: validate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeQL.yml

  version:
    name: Compute next version
    needs: codeql
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Check out with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version from latest tag
        id: next
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node .github/scripts/compute-release-version.js

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/Build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          mapfile -d '' ASSETS < <(find dist -maxdepth 1 -type f -print0)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No release files found in dist/" >&2
            exit 1
          fi
          RELEASE_ARGS=()
          if [[ "$CHANNEL" != "stable" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "v${VERSION}" "${ASSETS[@]}" "${RELEASE_ARGS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "EditText ${VERSION}" \
            --generate-notes
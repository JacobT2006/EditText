name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for this release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  open-pr:
    name: Open version bump PR
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26.10.0

      - name: Bump version and open pull request
        env:
          BUMP: ${{ inputs.bump }}
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          BRANCH="release/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: release ${TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore: release ${TAG}" \
            --body "Version bump (\`${BUMP}\`) for ${TAG}. Merging this PR builds and publishes the release."
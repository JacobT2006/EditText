name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for this release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL
    # Release only from the default branch. Downstream jobs are skipped with it.
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  version:
    name: Compute next version
    needs: codeql
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Check out with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version from latest tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LAST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          LAST="${LAST:-v0.0.0}"
          IFS=. read -r MA MI PA <<< "${LAST#v}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "Previous: ${LAST}  Next: v${MA}.${MI}.${PA}"
          echo "version=${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -d '' ASSETS < <(find dist -maxdepth 1 -type f -print0)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No release files found in dist/" >&2
            exit 1
          fi
          gh release create "v${VERSION}" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "EditText ${VERSION}" \
            --generate-notes
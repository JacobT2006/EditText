name: Publish release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve release version
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ "$HEAD_REF" != "release/${TAG}" ]]; then
            echo "Branch ${HEAD_REF} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: meta
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.meta.outputs.sha }}

  publish:
    name: Publish GitHub release
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          mapfile -d '' ASSETS < <(find dist -maxdepth 1 -type f -print0)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No release files found in dist/" >&2
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "EditText $VERSION" \
            --generate-notes